name: ことば幻獣ラジオ 第1・2回 5分版を制作・公開
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kotoba/episode01_short.json'
      - 'kotoba/episode02_short.json'
      - 'build_kotoba_short.py'
      - '.github/workflows/kotoba-short.yml'
permissions:
  contents: write
jobs:
  produce-and-publish-short:
    name: Produce, verify under 300 seconds, and publish unique short editions
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout existing series without changing the originals
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and launch proven VOICEVOX engine
        run: |
          python -m pip install 'requests>=2.30,<3' 'pydub>=0.25,<1'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name kotoba-short-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/speakers >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:50021/speakers >/dev/null
      - name: Generate true four-voice short dramas including thinking pauses
        run: |
          python build_kotoba_short.py
      - name: Hard reject MP3 over five minutes, verify metadata/sha/source
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          for num in ("01","02"):
              stem=f"episode{num}_short"
              meta=json.loads(pathlib.Path(f"site/kotoba/{stem}.json").read_text(encoding="utf-8"))
              script=json.loads(pathlib.Path(f"kotoba/{stem}.json").read_text(encoding="utf-8"))
              mp3=pathlib.Path(f"site/kotoba/{stem}.mp3")
              assert meta["episode_id"]==script["id"]==f"kotoba-episode-{int(num):03d}-short"
              assert meta["original_episode_id"]==f"kotoba-episode-{int(num):03d}"
              assert len(meta["vocabulary"])==5
              assert len(meta["chapters"])==4
              assert len(meta["thinking_pauses_ms"])>=4
              assert mp3.stat().st_size>200000
              assert hashlib.sha256(mp3.read_bytes()).hexdigest()==meta["sha256"]
              probed=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","csv=p=0",str(mp3)],text=True).strip())
              assert 120<=probed<=300, f"OVER FIVE MINUTES: {stem} {probed}s"
              print("PASS",stem,probed,"sec",mp3.stat().st_size,"bytes")
          assert pathlib.Path("site/kotoba/episode01.mp3").stat().st_size>300000
          assert pathlib.Path("site/kotoba/episode02.mp3").stat().st_size>300000
          print("Both original long episodes left untouched")
          PY
      - name: Archive real MP3 files as independent Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-5min-episodes-1-2
          path: |
            site/kotoba/episode01_short.mp3
            site/kotoba/episode01_short.json
            site/kotoba/episode02_short.mp3
            site/kotoba/episode02_short.json
          retention-days: 30
      - name: Save both short editions safely without overwriting any earlier show
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/kotoba/episode01_short.mp3 site/kotoba/episode01_short.json site/kotoba/episode02_short.mp3 site/kotoba/episode02_short.json
          git commit -m "Store five-minute versions of vocabulary radio episodes 1 and 2" || echo "Audio already committed"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Both five-minute episodes safely committed"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to push after retrying concurrent updates"
              exit 1
            fi
            sleep $((attempt*3))
          done
      - name: Publish two verified stable MP3 Release links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for num in 01 02; do
            stem="episode${num}_short"
            tag="kotoba-episode${num}-5min"
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -Fx "${stem}.mp3"
              echo "Existing short episode Release verified: $tag"
            else
              gh release create "$tag" "site/kotoba/${stem}.mp3" -R "$GITHUB_REPOSITORY" \
                --title "ことば幻獣ラジオ 第${num}回 5分版" \
                --notes "5分以内の耳で楽しむラジオドラマ。4人のVOICEVOXの声、オリジナルBGM・ジングル・効果音、推理タイムと3問のクイズ。元の長編版は別の公開先にそのまま保存。"
            fi
            gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets,url
          done
