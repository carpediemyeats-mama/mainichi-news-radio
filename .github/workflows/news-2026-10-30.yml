name: 2026-10-30 まいにちニュース音声・公開
on:
  push:
    branches: [main]
    paths:
      - 'news/2026-10-30/episode.json'
      - 'news/2026-10-30/build.py'
      - '.github/workflows/news-2026-10-30.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  produce-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get sources
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio dependencies and VOICEVOX
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.30,<3' 'pydub>=0.25,<1'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name mainichi-news-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/speakers >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:50021/speakers >/dev/null
      - name: Synthesize all stories with female announcer and original music
        run: |
          python news/2026-10-30/build.py
          test -s news/2026-10-30/site/mainichi-news-2026-10-30.mp3
          test -s news/2026-10-30/site/episode.json
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 news/2026-10-30/site/mainichi-news-2026-10-30.mp3
      - name: Preserve MP3 as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: mainichi-news-2026-10-30
          path: |
            news/2026-10-30/site/mainichi-news-2026-10-30.mp3
            news/2026-10-30/site/episode.json
          retention-days: 7
      - name: Create permanent public date-specific Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view news-2026-10-30 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload news-2026-10-30 news/2026-10-30/site/mainichi-news-2026-10-30.mp3 news/2026-10-30/site/episode.json -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create news-2026-10-30 news/2026-10-30/site/mainichi-news-2026-10-30.mp3 news/2026-10-30/site/episode.json -R "$GITHUB_REPOSITORY" --title "まいにちニュース｜2026年10月29日" --notes "VOICEVOX:No.7（アナウンス）。オリジナルBGM・ニュースジングル入り。10月29日のニュース10本、姫路の天気、昨日のラジオから一問。ニュースの出典は制作時に確認しています。" --latest=false
          fi
          gh release view news-2026-10-30 -R "$GITHUB_REPOSITORY" --json url,assets
