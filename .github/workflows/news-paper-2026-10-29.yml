name: 2026-10-29 新聞PDF公開
on:
  push:
    branches: [main]
    paths:
      - 'news/newspaper_2026-10-29.html'
      - '.github/workflows/news-paper-2026-10-29.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get newspaper
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Japanese fonts and PDF renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install weasyprint pypdf
      - name: Produce and verify printable A4 2-page PDF
        run: |
          mkdir -p dist
          python - <<'PY'
          from weasyprint import HTML, CSS
          from pypdf import PdfReader
          src='news/newspaper_2026-10-29.html'
          out='dist/mainichi-news-2026-10-29.pdf'
          HTML(filename=src).write_pdf(out, stylesheets=[CSS(string='@page{margin:9mm 11mm} @media print {.page{padding:0!important; margin:0!important; min-height:0!important} h1{font-size:25px!important}h2{font-size:17px!important}h3{font-size:14px!important}.mast{margin-bottom:7px!important;padding-bottom:5px!important}.block,.note,.question,.haiku,.green{padding:7px!important;margin:6px 0!important}.columns{gap:8px!important}.block p,.cell p,.note p,.green p,.question p{font-size:11px!important;line-height:1.35!important;margin:3px 0!important}.cell{padding:7px!important}.weather,.arrow{padding:4px!important;margin:5px 0!important}.haiku .verse{font-size:19px!important}.footline,.bottom{margin-top:4px!important}}')])
          pdf=PdfReader(out)
          print('pages:',len(pdf.pages))
          print('file:',out)
          if len(pdf.pages)!=2: raise RuntimeError('Newspaper must be exactly 2 pages')
          if len(open(out,'rb').read()) < 30000: raise RuntimeError('Newspaper PDF unexpectedly small')
          PY
          cp news/newspaper_2026-10-29.html dist/mainichi-news-2026-10-29.html
      - name: Publish PDF and HTML with today's radio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view news-2026-10-29 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Radio release is not published yet"
            exit 1
          fi
          gh release upload news-2026-10-29 dist/mainichi-news-2026-10-29.pdf dist/mainichi-news-2026-10-29.html -R "$GITHUB_REPOSITORY" --clobber
          gh release view news-2026-10-29 -R "$GITHUB_REPOSITORY" --json url,assets
