name: 歴史年代順・第3回音声プレーヤー最終確認
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chronology-web-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify fixed HTML, catalog and playable audio
        run: |
          BASE="https://githubraw.com/carpediemyeats-mama/mainichi-news-radio/1d8376acbcff87dc55612012695b1797ad8dbe6e/site/history/chronology"
          curl -fLsS --max-time 35 -H 'Sec-Fetch-Dest: document' -A 'Mozilla/5.0' "$BASE/index.html" -o /tmp/index.html
          grep -q 'metadataBase=' /tmp/index.html
          curl -fLsS --max-time 35 "$BASE/catalog.json" -o /tmp/catalog.json
          curl -fLsS --max-time 35 "$BASE/chronology-003.json" -o /tmp/episode.json
          python - <<'PY'
          import json
          cat=json.load(open('/tmp/catalog.json'))
          ep=json.load(open('/tmp/episode.json'))
          assert [x['id'] for x in cat]==['chronology-001','chronology-002','chronology-003']
          assert ep['id']=='chronology-003' and ep['duration_seconds']==513
          assert ep['audio_file']=='chronology-003.mp3' and len(ep['chapters'])==7
          print('PUBLIC_PLAYER_CATALOG_AND_METADATA_VERIFIED')
          PY
          status=$(curl -sSL --max-time 45 -H 'Range: bytes=0-65535' -o /tmp/audio-fragment -w '%{http_code}' "$BASE/chronology-003.mp3")
          echo "AUDIO_HTTP=$status"
          test "$status" = 200 -o "$status" = 206
          python - <<'PY'
          b=open('/tmp/audio-fragment','rb').read()
          assert len(b)>1000 and (b[:3]==b'ID3' or (b[0]==255 and b[1]&224==224))
          print("PUBLIC_MP3_AUDIO_VERIFIED",len(b))
          PY
