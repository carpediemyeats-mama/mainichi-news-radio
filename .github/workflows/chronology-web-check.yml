name: 歴史年代順・第3回プレーヤー固定版確認
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chronology-web-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare version-fixed HTML hosts
        run: |
          SHA=1d8376acbcff87dc55612012695b1797ad8dbe6e
          for URL in \
            "https://githubraw.com/carpediemyeats-mama/mainichi-news-radio/$SHA/site/history/chronology/index.html" \
            "https://rawcdn.githack.com/carpediemyeats-mama/mainichi-news-radio/$SHA/site/history/chronology/index.html" \
            "https://raw.githack.com/carpediemyeats-mama/mainichi-news-radio/$SHA/site/history/chronology/index.html"; do
            echo "TEST_URL=$URL"
            curl -sSL --max-time 40 -o /tmp/test.html -D /tmp/test-headers -w 'STATUS=%{http_code} BYTES=%{size_download}\n' "$URL" || true
            grep -iE '^content-type:|^content-security-policy:' /tmp/test-headers | tail -5 || true
            grep -q 'metadataBase=' /tmp/test.html && echo "NEW_HTML_FOUND" || echo "OLD_OR_BLOCKED"
            curl -sSL --max-time 40 -H 'Sec-Fetch-Dest: document' -A 'Mozilla/5.0' -o /tmp/browser.html -w 'BROWSER_STATUS=%{http_code}\n' "$URL" || true
            grep -q 'metadataBase=' /tmp/browser.html && echo "BROWSER_NEW_HTML" || echo "BROWSER_NOT_NEW"
          done
