name: 歴史年代順・静的サイトの互換性検証
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chronology-web-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check Statically and GitHubRaw
        run: |
          for BASE in \
            'https://cdn.statically.io/gh/carpediemyeats-mama/mainichi-news-radio@main/site/history/chronology' \
            'https://githubraw.com/carpediemyeats-mama/mainichi-news-radio/main/site/history/chronology'; do
            echo "========== HOST $BASE"
            for file in index.html catalog.json chronology-001.mp3; do
              echo "-- $file"
              curl --location --silent --show-error --max-time 35 -D /tmp/headers -o /tmp/body -w 'STATUS %{http_code} BYTES %{size_download}\n' "$BASE/$file" || true
              grep -iE '^content-type:|^content-length:|^content-disposition:|^x-content-type-options:' /tmp/headers | tail -10 || true
              if [ "$file" = 'index.html' ]; then
                grep -q '歴史の謎を追え' /tmp/body && echo 'HTML_PRESENT' || echo 'HTML_NOT_FOUND'
              fi
            done
            curl --location --silent --show-error --max-time 35 -H 'Sec-Fetch-Dest: document' -A 'Mozilla/5.0' -o /tmp/browser -w 'BROWSER_CODE %{http_code}\n' "$BASE/index.html" || true
            grep -q '歴史の謎を追え' /tmp/browser && echo 'BROWSER_DIRECT' || echo 'BROWSER_BLOCK_OR_CONFIRM'
            curl --location --silent --show-error --max-time 35 -I "$BASE/chronology-001.mp3" | head -n 10 || true
          done
