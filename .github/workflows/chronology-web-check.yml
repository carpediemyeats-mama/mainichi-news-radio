name: 歴史年代順・第3回公開と最新プレーヤー確認
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chronology-web-check.yml'
permissions:
  contents: read
jobs:
  check-public-player:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify fresh catalog, metadata, HTML and MP3 using static host
        run: |
          RAW='https://raw.githubusercontent.com/carpediemyeats-mama/mainichi-news-radio/main/site/history/chronology'
          PLAYER='https://githubraw.com/carpediemyeats-mama/mainichi-news-radio/main/site/history/chronology'
          curl -fLsS --max-time 35 "$RAW/catalog.json?edition=chronology-003" -D /tmp/catalog-headers -o /tmp/catalog.json
          cat /tmp/catalog-headers | grep -iE '^access-control-allow-origin:|^content-type:|^cache-control:' || true
          python - <<'PY'
          import json
          c=json.load(open('/tmp/catalog.json'))
          assert [e['id'] for e in c]==['chronology-001','chronology-002','chronology-003'], c
          print('CATALOG_3_EPISODES_VERIFIED')
          PY
          curl -fLsS --max-time 35 "$RAW/chronology-003.json?episode=chronology-003" -o /tmp/ep.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ep.json'))
          assert d['id']=='chronology-003' and d['duration_seconds']==513
          assert len(d['chapters'])==7
          print('METADATA_003_VERIFIED')
          PY
          curl -fLsS --max-time 35 "$PLAYER/index.html?version=3" -o /tmp/player.html
          grep -q '第1回から順番に聴こう' /tmp/player.html
          grep -q 'raw.githubusercontent.com/carpediemyeats-mama/mainichi-news-radio' /tmp/player.html
          echo 'FRESH_HTML_PLAYER_VERIFIED'
          HTTP=$(curl -LsS --max-time 45 -H 'Range: bytes=0-65535' "$PLAYER/chronology-003.mp3" -o /tmp/part.mp3 -w '%{http_code}')
          test "$HTTP" = 200 -o "$HTTP" = 206
          python - <<'PY'
          data=open('/tmp/part.mp3','rb').read()
          assert len(data)>1000
          assert data[:3]==b'ID3' or (data[0]==255 and data[1]&224==224)
          print('PUBLIC_MP3_AUDIO_BYTES_VERIFIED',len(data))
          PY
