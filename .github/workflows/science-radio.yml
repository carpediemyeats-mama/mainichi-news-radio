name: 理科のふしぎラジオ・第01回をVOICEVOXで公開
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/science-radio.yml'
      - 'science/episode01.txt'
      - 'science/build_radio.py'
      - 'science/make_worksheet.py'
permissions:
  contents: write
jobs:
  build-science-radio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout all existing shows without modifying them
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup VOICEVOX and media tools
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.30,<3' 'pydub>=0.25,<1' 'reportlab>=4,<5'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name science-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/speakers >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:50021/speakers >/dev/null
      - name: Produce original audio and one-page worksheet
        run: |
          python science/make_worksheet.py
          python science/build_radio.py
          test -s site/science/episode01.mp3
          test -s site/science/episode01.json
          test -s site/science/episode01-worksheet.pdf
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 site/science/episode01.mp3
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('site/science/episode01.mp3')
          j=json.loads(pathlib.Path('site/science/episode01.json').read_text(encoding='utf8'))
          assert j['episode_id']=='science-episode01'
          assert j['audio_file']=='episode01.mp3'
          assert j['seconds']>=180
          assert len(j['chapters'])==6
          assert p.stat().st_size>180000
          assert hashlib.sha256(p.read_bytes()).hexdigest()==j['sha256']
          assert pathlib.Path('site/science/episode01-worksheet.pdf').read_bytes().startswith(b'%PDF-')
          print('SCIENCE MP3 VERIFIED',j['seconds'],p.stat().st_size)
          PY
      - name: Publish as isolated permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view science-episode01 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload science-episode01 site/science/episode01.mp3 site/science/episode01.json site/science/episode01-worksheet.pdf -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create science-episode01 site/science/episode01.mp3 site/science/episode01.json site/science/episode01-worksheet.pdf -R "$GITHUB_REPOSITORY" --title "理科のふしぎラジオ 第01回 さなぎは、いる？ いない？" --notes "耳だけで楽しめる昆虫変身ミステリー。2人のVOICEVOX音声、オリジナルBGMと効果音、15回のクイズ解答待ち時間。A4復習プリント1枚を添付。既存ニュース・語彙・ことわざラジオとは独立公開。" --latest=false
          fi
          gh release view science-episode01 -R "$GITHUB_REPOSITORY" --json url,assets
          gh release view science-episode01 -R "$GITHUB_REPOSITORY" --json assets | python -c 'import json,sys; a={x["name"]:x for x in json.load(sys.stdin)["assets"]}; assert a["episode01.mp3"]["size"]>180000; assert a["episode01-worksheet.pdf"]["size"]>1000; print("RELEASE VERIFIED",a["episode01.mp3"]["size"])'
      - name: Backup published files as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: science-radio-episode01
          path: |
            site/science/episode01.mp3
            site/science/episode01.json
            site/science/episode01-worksheet.pdf
          retention-days: 30
