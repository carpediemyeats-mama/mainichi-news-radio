name: ことば幻獣ラジオ 第1回 音声制作・公開
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kotoba/episode01.json'
      - 'build_kotoba_radio.py'
      - 'site/kotoba/index.html'
      - '.github/workflows/kotoba-radio.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radio-deployment
  cancel-in-progress: false
jobs:
  produce:
    name: Generate real fantasy vocabulary radio and preserve other shows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools and start VOICEVOX
        run: |
          python -m pip install 'requests>=2.30,<3' 'pydub>=0.25,<1'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name vocabulary-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/speakers >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:50021/speakers >/dev/null
      - name: Create and verify genuine audio
        run: |
          python build_kotoba_radio.py
          test -s site/kotoba/episode01.mp3
          test -s site/kotoba/episode01.json
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 site/kotoba/episode01.mp3
      - name: Save generated episode to repository for all future deployments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/kotoba/episode01.mp3 site/kotoba/episode01.json
          git commit -m "Publish vocabulary radio episode 1 real MP3" || echo "No change"
          git push origin HEAD:main
      - name: Preserve original news radio audio
        run: |
          if [ ! -s site/episode.mp3 ] || [ ! -s site/episode.json ]; then
            curl -fSL --retry 3 --connect-timeout 20 'https://carpediemyeats-mama.github.io/mainichi-news-radio/episode.mp3' -o site/episode.mp3 || true
            curl -fSL --retry 3 --connect-timeout 20 'https://carpediemyeats-mama.github.io/mainichi-news-radio/episode.json' -o site/episode.json || true
          fi
          if ! ffprobe -v error -show_entries format=duration -of csv=p=0 site/episode.mp3 >/dev/null 2>&1 || [ ! -s site/episode.json ]; then
            python build_radio.py
          fi
          test -s site/episode.mp3
          test -s site/episode.json
      - name: Preserve existing proverb show
        run: |
          test -s site/kotowaza/episode01.mp3
          test -s site/kotowaza/episode01.json
      - name: Upload new MP3 as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-genju-episode01
          path: |
            site/kotoba/episode01.mp3
            site/kotoba/episode01.json
          retention-days: 30
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload all existing and new show pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
