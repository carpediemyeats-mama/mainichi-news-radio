name: まいにちニュース 2026-10-30 音声制作と公開
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-20261030.yml'
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup VOICEVOX and ffmpeg
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.30,<3' 'pydub>=0.25,<1'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name mainichi-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/speakers >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:50021/speakers >/dev/null
      - name: Synthesize original music and Japanese news
        run: |
          python build_news_20261030.py
          test -s site/2026-10-30/episode.mp3
          test -s site/2026-10-30/episode.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('site/2026-10-30/episode.json').read_text())
          print('Duration seconds:',d['seconds'])
          assert 840 <= d['seconds'] <= 960, 'Audio duration outside 14-16 minutes'
          PY
      - name: Preserve audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: mainichi-news-2026-10-30
          path: |
            site/2026-10-30/episode.mp3
            site/2026-10-30/episode.json
          retention-days: 30
      - name: Publish unique dated MP3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view news-2026-10-30 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload news-2026-10-30 site/2026-10-30/episode.mp3 site/2026-10-30/episode.json -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create news-2026-10-30 site/2026-10-30/episode.mp3 site/2026-10-30/episode.json -R "$GITHUB_REPOSITORY" --title "まいにちニュース 2026年10月30日" --notes "10月29日の検証済みニュース10本、姫路の天気、前日ラジオから一問。VOICEVOX No.7、オリジナル音楽。"
          fi
          gh release view news-2026-10-30 -R "$GITHUB_REPOSITORY" --json url,assets
