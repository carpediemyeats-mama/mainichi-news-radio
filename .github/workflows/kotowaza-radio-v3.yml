name: ことわざ事件簿 第1回・5分版制作公開
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kotowaza/episode01_v3.json'
      - 'build_kotowaza_radio_v3.py'
      - '.github/workflows/kotowaza-radio-v3.yml'
permissions:
  contents: write
jobs:
  publish:
    name: Generate, verify and publish new short MP3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install voice and music prerequisites
        run: |
          python -m pip install 'requests>=2.30,<3' 'pydub>=0.25,<1'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name kotowaza-v3-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/speakers >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:50021/speakers >/dev/null
      - name: Build short MP3 and verify exact episode identity
        run: |
          python build_kotowaza_radio_v3.py
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 site/kotowaza/episode01_v3.mp3
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('site/kotowaza/episode01_v3.mp3')
          d=json.load(open('site/kotowaza/episode01_v3.json'))
          assert d['episode_id']=='kotowaza-episode-001-v3'
          assert d['filename']==p.name
          assert d['sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert d['answer_pauses']==5
          assert len(d['vocabulary'])==6
          assert 240<=d['seconds']<=360
          print('MP3 validated:', d['title'],d['duration_label'],p.stat().st_size)
          PY
      - name: Publish new public MP3 and its metadata as separate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view kotowaza-episode01-v3 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release tag exists: refusing to overwrite published audio.'
            exit 1
          fi
          gh release create kotowaza-episode01-v3 site/kotowaza/episode01_v3.mp3 site/kotowaza/episode01_v3.json -R "$GITHUB_REPOSITORY" --title "ことわざ事件簿！ 第1回・5分集中版" --notes "6つのことわざ・慣用句を中心に、3つの短い場面と5回の回答時間で学ぶ音声ラジオ。VOICEVOXの4声、オリジナルBGM・ジングル・効果音。これまでのニュース・第1回旧版を変更せず公開。"
          gh release view kotowaza-episode01-v3 -R "$GITHUB_REPOSITORY" --json url,assets
      - name: Keep a verified copy as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotowaza-episode01-v3-5min
          path: |
            site/kotowaza/episode01_v3.mp3
            site/kotowaza/episode01_v3.json
          retention-days: 30
