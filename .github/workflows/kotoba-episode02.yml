name: ことば幻獣ラジオ 第2回 音声制作と公開
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kotoba/episode02.json'
      - 'build_kotoba_ep02.py'
      - '.github/workflows/kotoba-episode02.yml'
permissions:
  contents: write
jobs:
  build-and-publish:
    name: Make and publish genuine second-episode MP3 (no Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout all existing programs without editing them
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start proven VOICEVOX audio engine
        run: |
          python -m pip install 'requests>=2.30,<3' 'pydub>=0.25,<1'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name kotoba-ep02-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/speakers >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:50021/speakers >/dev/null
      - name: Synthesize four voices, original BGM and two kinds of bell audio
        run: |
          python build_kotoba_ep02.py
          test -s site/kotoba/episode02.mp3
          test -s site/kotoba/episode02.json
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 site/kotoba/episode02.mp3
      - name: Check episode identity, duration, source words and SHA256
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          source=json.loads(pathlib.Path("kotoba/episode02.json").read_text(encoding="utf-8"))
          meta=json.loads(pathlib.Path("site/kotoba/episode02.json").read_text(encoding="utf-8"))
          mp3=pathlib.Path("site/kotoba/episode02.mp3")
          assert source["id"]==meta["episode_id"]=="kotoba-episode-002"
          assert meta["edition"]=="第2回"
          assert meta["filename"]=="episode02.mp3"
          assert meta["seconds"]>=600
          assert len(meta["chapters"])==6
          assert len(meta["vocabulary"])==10
          assert len(meta["thinking_pauses_ms"])>=8
          assert hashlib.sha256(mp3.read_bytes()).hexdigest()==meta["sha256"]
          assert mp3.stat().st_size>300000
          assert not pathlib.Path("site/kotoba/episode01.mp3").stat().st_size<300000
          print("EPISODE 2 AUDIO VERIFIED",meta["duration_label"],mp3.stat().st_size,"bytes")
          PY
      - name: Preserve newly synthesized MP3 as workflow artifact before any Git push
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-episode02-verified
          path: |
            site/kotoba/episode02.mp3
            site/kotoba/episode02.json
          retention-days: 30
      - name: Save episode 2 in its own separate files with concurrent-update protection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/kotoba/episode02.mp3 site/kotoba/episode02.json
          git commit -m "Store independently verified episode 2 radio audio" || echo "Files already committed"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Audio committed without overriding other concurrent workflows"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Could not safely publish after five concurrent-update retries"
              exit 1
            fi
            sleep $((attempt * 3))
          done
      - name: Publish unique public GitHub Release for episode 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view kotoba-episode02 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Episode 2 already published: validating the existing Release"
            gh release view kotoba-episode02 -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -Fx episode02.mp3
          else
            gh release create kotoba-episode02 site/kotoba/episode02.mp3 -R "$GITHUB_REPOSITORY" \
              --title "ことば幻獣ラジオ 第2回 十三番目の鐘と月の橋" \
              --notes "4人の声とオリジナルBGM・効果音による一話完結の語彙力ミステリー。全6章、729語マスターの新しい10語、途中で2回の推理タイムと最後の7問。第1回はそのまま保存されています。"
          fi
          gh release view kotoba-episode02 -R "$GITHUB_REPOSITORY" --json url,assets
          gh release view kotoba-episode02 -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -Fx episode02.mp3
