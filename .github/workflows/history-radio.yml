name: 歴史の扉・独立音声生成と永続公開
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'history/episode.json'
      - 'history/build_history.py'
      - 'site/history/index.html'
      - '.github/workflows/history-radio.yml'
permissions:
  contents: write
jobs:
  create-history-radio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout without changing existing shows
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start VOICEVOX and audio tools
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.30,<3' 'pydub>=0.25,<1'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          ffmpeg -version | head -1
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name history-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/speakers >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:50021/speakers >/dev/null
      - name: Generate and verify real history MP3
        run: |
          python history/build_history.py
          python - <<'PY'
          import json,hashlib,pathlib,subprocess
          root=pathlib.Path('site/history')
          d=json.loads((root/'episode.json').read_text(encoding='utf8'))
          e=json.loads(pathlib.Path('history/episode.json').read_text(encoding='utf8'))
          p=root/d['audio_file']
          assert d['id']==e['id']
          assert p.is_file() and p.stat().st_size>=250000
          assert hashlib.sha256(p.read_bytes()).hexdigest()==d['sha256']
          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(p)],text=True).strip())
          assert 180<=duration<=900 and abs(duration-d['duration_seconds'])<=2
          assert len(d['chapters'])==len(e['chapters'])
          print('HISTORY_MP3_VERIFIED',p,duration,p.stat().st_size)
          PY
      - name: Backup verified MP3
        uses: actions/upload-artifact@v4
        with:
          name: history-radio-episode
          path: |
            site/history/*.mp3
            site/history/episode.json
          retention-days: 30
      - name: Commit history MP3 without modifying existing shows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/history/*.mp3 site/history/episode.json
          git commit -m "Archive verified history radio MP3" || echo "Audio already archived"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "History MP3 preserved safely"
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt*3))
          done
      - name: Publish independently tagged MP3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python -c 'import json; print(json.load(open("history/episode.json"))["id"])')
          FILE=$(python -c 'import json; print(json.load(open("site/history/episode.json"))["audio_file"])')
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "site/history/$FILE" site/history/episode.json -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "site/history/$FILE" site/history/episode.json \
              -R "$GITHUB_REPOSITORY" --title "歴史の扉 第1回 信長の鉄砲は、世界を旅してきた!?" \
              --notes "日本史から世界史へ。VOICEVOX:No.7／VOICEVOX:ずんだもん。オリジナル音楽。家族の個人情報なし。" --latest=false
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets |
            python -c 'import json,sys; d=json.load(sys.stdin)["assets"]; mp3=[x for x in d if x["name"].endswith(".mp3")]; assert len(mp3)==1 and mp3[0]["size"]>250000; print("RELEASE_MP3_VERIFIED",mp3[0]["name"],mp3[0]["size"])'
