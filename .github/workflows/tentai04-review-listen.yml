name: 理科・天体観測 復習の聞き流しラジオを制作
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'science/tentai04/review_listen.json'
      - 'science/tentai04/build_review_listen.py'
      - '.github/workflows/tentai04-review-listen.yml'
permissions:
  contents: write
jobs:
  publish-relaxed-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout all existing shows, untouched
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start the proven VOICEVOX and music synthesis stack
        run: |
          python -m pip install 'requests>=2.30,<3' 'pydub>=0.25,<1'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name astronomy-relaxed-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/speakers >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:50021/speakers >/dev/null
      - name: Create calm conversational review without question-answer pauses
        run: |
          python science/tentai04/build_review_listen.py
          python - <<'PY'
          import json,hashlib,pathlib,subprocess
          base=pathlib.Path("site/science/tentai04")
          audio=base/"review_listen.mp3"
          meta=json.loads((base/"review_listen.json").read_text(encoding="utf-8"))
          assert meta["episode_id"]=="tentai04-review-listen-001"
          assert meta["filename"]=="review_listen.mp3"
          assert meta["quiz_count"]==0
          assert len(meta["chapters"])==4
          assert meta["source_sha256"]==hashlib.sha256(pathlib.Path("science/tentai04/review_listen.json").read_bytes()).hexdigest()
          assert meta["sha256"]==hashlib.sha256(audio.read_bytes()).hexdigest()
          sec=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","csv=p=0",str(audio)],text=True))
          assert 210<sec<850 and abs(sec-meta["seconds"])<2
          assert audio.stat().st_size>300000
          for old in ("pre","review","deep"):
              assert (base/(old+".mp3")).stat().st_size>1000000
          print("REAL LISTEN-THROUGH MP3 VERIFIED",round(sec,2),audio.stat().st_size)
          print("ALL PRIOR PRE/REVIEW/DEEP MP3s STILL PRESENT")
          PY
      - name: Archive actual MP3 and metadata independently
        uses: actions/upload-artifact@v4
        with:
          name: astronomy-review-relaxed-listening
          path: |
            site/science/tentai04/review_listen.mp3
            site/science/tentai04/review_listen.json
          retention-days: 30
      - name: Publish as a separately named permanent release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view science-tentai04-review-listen -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload science-tentai04-review-listen site/science/tentai04/review_listen.mp3 site/science/tentai04/review_listen.json -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create science-tentai04-review-listen site/science/tentai04/review_listen.mp3 site/science/tentai04/review_listen.json -R "$GITHUB_REPOSITORY" \
              --title "星空探偵ラジオ 第4回 復習・聞き流し編" \
              --notes "楽しみながら授業の記憶がよみがえる、3人のVOICEVOXの会話とオリジナルBGM。受験で重要な夏冬の大三角、星座名と1等星、等級、星の色、自転と公転、星座早見の日時計算を自然に繰り返します。元の3編とニュース番組には変更なし。" --latest=false
          fi
          gh release view science-tentai04-review-listen -R "$GITHUB_REPOSITORY" --json assets | python -c 'import json,sys; d={a["name"]:a["size"] for a in json.load(sys.stdin)["assets"]}; assert d.get("review_listen.mp3",0)>300000 and d.get("review_listen.json",0)>100; print("PUBLIC MP3 VERIFIED",d)'
      - name: Save only the new relaxed recording, without touching existing shows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/science/tentai04/review_listen.mp3 site/science/tentai04/review_listen.json
          git commit -m "Add new relaxed astronomy review audio and verified metadata" || echo "No change"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt*3))
          done
