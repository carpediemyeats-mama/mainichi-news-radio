name: Fix November 1 radio display title
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-news-2026-11-01-title.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Correct published release title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit news-2026-11-01 -R "$GITHUB_REPOSITORY" --title "まいにちニュース｜2026年11月1日（日）" --notes "VOICEVOX:No.7（アナウンス）／音楽・ジングル付き15分15秒。10月31日までに起きたニュース10本、11月1日の姫路市の天気、昨日のラジオから一問。"
          gh release view news-2026-11-01 -R "$GITHUB_REPOSITORY" --json name,url,assets
