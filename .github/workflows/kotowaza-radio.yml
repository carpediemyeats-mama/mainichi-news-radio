name: ことわざ事件簿 第1回ラジオ制作
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kotowaza/episode01.json'
      - 'build_kotowaza_radio.py'
      - 'site/kotowaza/index.html'
permissions:
  contents: write
concurrency:
  group: kotowaza-release
  cancel-in-progress: false
jobs:
  publish:
    name: Build and publish standalone proverb radio
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with write permission
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio tools and launch VOICEVOX
        run: |
          python -m pip install 'requests>=2.30,<3' 'pydub>=0.25,<1'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name proverb-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/speakers >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:50021/speakers >/dev/null
      - name: Generate real multi-speaker MP3 and chapter metadata
        run: |
          python build_kotowaza_radio.py
          test -s site/kotowaza/episode01.mp3
          test -s site/kotowaza/episode01.json
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 site/kotowaza/episode01.mp3
      - name: Persist generated episode to Git for future news deployments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/kotowaza/episode01.mp3 site/kotowaza/episode01.json
          git commit -m "Publish proverb radio episode 1 real MP3" || echo "Episode already recorded"
          git push origin HEAD:main
      - name: Publish MP3 through the already-proven Releases workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view kotowaza-episode01 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload kotowaza-episode01 site/kotowaza/episode01.mp3 -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create kotowaza-episode01 site/kotowaza/episode01.mp3 -R "$GITHUB_REPOSITORY" --title "ことわざ事件簿！ 第1回 ゲームセンター大事件" --notes "ことわざ検定9級に向けて、6語を学ぶオリジナル音声ドラマ。VOICEVOXの4人による声、オリジナルBGM、6問クイズ付き。"
          fi
          gh release view kotowaza-episode01 -R "$GITHUB_REPOSITORY" --json url,assets
