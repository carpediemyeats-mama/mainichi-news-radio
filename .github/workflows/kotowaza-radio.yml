name: ことわざ事件簿 第1回ラジオ制作
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kotowaza/episode01.json'
      - 'build_kotowaza_radio.py'
      - 'site/kotowaza/index.html'
      - '.github/workflows/kotowaza-radio.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radio-deployment
  cancel-in-progress: false
jobs:
  publish:
    name: Build and publish standalone proverb radio
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout with write permission
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio tools and launch VOICEVOX
        run: |
          python -m pip install 'requests>=2.30,<3' 'pydub>=0.25,<1'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name proverb-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/speakers >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:50021/speakers >/dev/null
      - name: Generate real multi-speaker MP3 and chapter metadata
        run: |
          python build_kotowaza_radio.py
          test -s site/kotowaza/episode01.mp3
          test -s site/kotowaza/episode01.json
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 site/kotowaza/episode01.mp3
      - name: Persist generated episode to Git for future news deployments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/kotowaza/episode01.mp3 site/kotowaza/episode01.json
          git commit -m "Publish proverb radio episode 1 real MP3" || echo "Episode already recorded"
          git push origin HEAD:main
      - name: Preserve existing mainichi-news audio without changing its code
        run: |
          if [ ! -s site/episode.mp3 ] || [ ! -s site/episode.json ]; then
            curl -fSL --retry 3 --connect-timeout 20 \
              'https://carpediemyeats-mama.github.io/mainichi-news-radio/episode.mp3' -o site/episode.mp3 || true
            curl -fSL --retry 3 --connect-timeout 20 \
              'https://carpediemyeats-mama.github.io/mainichi-news-radio/episode.json' -o site/episode.json || true
          fi
          if ! ffprobe -v error -show_entries format=duration -of csv=p=0 site/episode.mp3 >/dev/null 2>&1 || [ ! -s site/episode.json ]; then
            echo 'Published news audio could not be retrieved. Regenerate it with existing verified builder.'
            python build_radio.py
          fi
          test -s site/episode.mp3
          test -s site/episode.json
          echo 'Existing news and new proverb programs both present for deployment.'
      - name: Save real episode as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotowaza-episode01
          path: |
            site/kotowaza/episode01.mp3
            site/kotowaza/episode01.json
          retention-days: 30
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish website
        uses: actions/deploy-pages@v4
        id: deploy
